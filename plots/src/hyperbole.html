<body>

	<div class="preloader">
		<div class="pulse"></div>

	<div id="my-page">
		<div id="my-header">
			<header class="site-header">
				@@include('./parts/my-menu.html')

				<div class="row justify-content-center">
					<div class="col-lg-10 text-center">
						<h1 class="h1">Гипербола</h1>
					</div>
				</div>

				<div class="hyperbole-container">
					<div class="row justify-content-center">

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="hyperbole-column">
								<div id="hyperbolePlot1" class="jxgbox"></div>
								<div class="row">
									<div class="col-12">
										<p id="hyperbolePlot1Desc" class="text-center">$$Функция\;\;y=\frac{1}{x}$$</p>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="hyperbole-column">
								<div id="hyperbolePlot2" class="jxgbox"></div>
								<div class="row">
									<div class="col-12">
										<p id="hyperbolePlot2Desc" class="text-center">
											$$Функция\;\;y=\frac{ax+b}{cx+d}=$$$$\;p+\frac{s}{x+q}$$&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="hyperbole-column">
								<div id="hyperbolePlot3" class="jxgbox"></div>
								<div class="row">
									<div class="col-12">
										<p id="hyperbolePlot3Desc" class="text-center">$$Кривая\;\;\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$$</p>
									</div>
								</div>
							</div>
						</div>

					</div>
				</div>

				<div class="row justify-content-center">
					<div class="col-lg-10 text-center">
						<h1 style="margin-top: 3px; margin-bottom: 10px;">Примеры</h1>
					</div>
				</div>

				<div class="hyperbole-container">
					<div class="row justify-content-center">

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="hyperbole-column">
								<div class="row hyperboleExampleDescRow">
									<div class="col-12">
										<p class="hyperboleExampleDesc text-center">$$y=4+\frac{s}{x+2}$$</p>
									</div>
									<div class="col-12">
										<p class="hyperboleExampleDesc text-center"><span class="blue">$$s=2$$</span></p>
									</div>
									<div class="col-12">
										<p class="hyperboleExampleDesc text-center"><span class="green">$$s=-2$$</span></p>
									</div>
									<div class="col-12">
										<p class="hyperboleExampleDesc text-center"><span class="red">$$s=4$$</span></p>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">

							</div>
						</div>
