					<div class="col-lg-10 text-center">
						<h1 class="h1">Парабола</h1>
					</div>
				</div>

				<div class="parabola-container">
					<div class="row justify-content-center">

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="parabola-column">
								<div id="parabolaPlot1" class="jxgbox"></div>
								<div class="row">
									<div class="col-12">
										<p id="parabolaPlot1Desc" class="text-center">$$y=a\cdot (x-p)^2+m$$</p>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="parabola-column">
								<div id="parabolaPlot2" class="jxgbox"></div>
								<div class="row">
									<div class="col-12">
										<p id="parabolaPlot2Desc" class="text-center">$$y=ax^2+bx+c,\;a>0$$</p>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="parabola-column">
								<div id="parabolaPlot3" class="jxgbox"></div>
								<div class="row">
									<div class="col-12">
										<p id="parabolaPlot3Desc" class="text-center">$$y=ax^2+bx+c,\;a<0$$</p>
									</div>
								</div>
							</div>
						</div>

					</div>
				</div>

				<div class="row justify-content-center">
					<div class="col-lg-10 text-center">
						<h1 style="margin-bottom: 15px;">Примеры</h1>
					</div>
				</div>

				<div class="parabola-container">
					<div class="row justify-content-center">

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
							<div class="parabola-column">
								<div class="row parabolaExampleDescRow">
									<div class="col-12">
										<p class="parabolaExampleDesc text-center"><span class="purple">$$y=2\cdot (x-3)^2+1$$</span></p>
									</div>
									<div class="col-12">
										<p class="parabolaExampleDesc text-center"><span class="red">$$y=\frac{1}{2}\cdot (x-3)^2+1$$</span>
										</p>
									</div>
									<div class="col-12">
										<p class="parabolaExampleDesc text-center"><span class="green">$$y=-2\cdot (x-3)^2+1$$</span></p>
									</div>
									<div class="col-12">
										<p class="parabolaExampleDesc text-center" style="margin-top: 12px;"><span class="blue">$$y=-2\cdot
												(x-3)^2-2$$</span></p>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-10 col-sm-9 col-lg-7 col-xl-4 text-justify">
